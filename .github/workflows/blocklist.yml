name: Build blocklist

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: blocklist-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build blocklist artifact
        env:
          URLHAUS_API_KEY: ${{ secrets.URLHAUS_API_KEY }}
        run: npm run blocklist:build

      - name: Commit refreshed artifact
        run: |
          git config user.name "nearguard-bot"
          git config user.email "nearguard-bot@users.noreply.github.com"
          git add data/blocklist.bin data/blocklist-meta.json data/blocklist-allowlist.json
          if git diff --cached --quiet; then
            echo "No blocklist changes to commit."
          else
            git commit -m "chore: refresh blocklist"
            git push
          fi
